name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  check-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar loja no Supabase
        env:
          SUPABASE_URL: https://dhpsrhbxhaaprmotbabb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Configure o secret SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions. Use a chave publica publishable/anon, nunca service_role."
            exit 1
          fi

          response_file="$RUNNER_TEMP/supabase-keep-alive.json"
          http_code=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors --retry-max-time 120 \
            --connect-timeout 10 --max-time 25 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --output "$response_file" --write-out '%{http_code}' \
            "$SUPABASE_URL/rest/v1/stores?select=id&slug=eq.marianomenswear&limit=1")

          if [[ "$http_code" != "200" ]]; then
            echo "::error::A consulta ao Supabase retornou HTTP $http_code."
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const stores = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(stores) || stores.length !== 1 || !stores[0].id) {
            throw new Error('A API respondeu, mas a loja nao foi encontrada.');
          }
          console.log('Supabase disponivel: consulta da loja concluida.');
          NODE
